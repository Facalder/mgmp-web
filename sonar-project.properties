sonar.projectKey=mgmp_mgmp-web
sonar.organization=mgmp
sonar.projectName=mgmp-web
sonar.projectVersion=0.1.0

# Source configuration
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx

# Exclusions – skip non-inspectable or generated files
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/migrations/**,\
  **/public/**,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/next-env.d.ts

# Test configuration (no test suite configured yet; adjust when tests are added)
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage report path (configure when coverage is set up)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript-specific
sonar.typescript.tsconfigPath=tsconfig.json

# Code smell / duplication tuning
sonar.cpd.exclusions=\
  **/node_modules/**,\
  **/.next/**